global
    log stdout format raw local0
    maxconn 2048
    nbthread 1

defaults
    mode tcp
    log global
    option dontlognull
    timeout connect 1s
    timeout client 30s
    timeout server 30s
    timeout tunnel 30s

frontend fe_rinha
    bind *:9999
    default_backend be_api

backend be_api
    balance roundrobin
    option tcp-check
    server api01 api01:3000 check
    server api02 api02:3000 check
