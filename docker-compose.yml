name: rinha-backend-2026

services:
  lb:
    image: haproxy:2.9-alpine
    command: ["haproxy", "-f", "/usr/local/etc/haproxy/haproxy.cfg", "-db"]
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "9999:9999"
    depends_on:
      - api01
      - api02
    deploy:
      resources:
        limits:
          cpus: "0.05"
          memory: 20MB

  api01:
    image: acauhi/rinha-2026-rust@sha256:4d9ff9772bf1933e27c08ea7aebb6320c9ba9093c964f188ee45dd8d23abfd53
    deploy:
      resources:
        limits:
          cpus: "0.475"
          memory: 165MB

  api02:
    image: acauhi/rinha-2026-rust@sha256:4d9ff9772bf1933e27c08ea7aebb6320c9ba9093c964f188ee45dd8d23abfd53
    deploy:
      resources:
        limits:
          cpus: "0.475"
          memory: 165MB
