name: rinha-backend-2026

services:
  lb:
    image: haproxy:2.9-alpine
    command: ["haproxy", "-f", "/usr/local/etc/haproxy/haproxy.cfg", "-db"]
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "9999:9999"
    depends_on:
      - api01
      - api02
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: 20MB

  api01:
    image: acauhi/rinha-2026-rust@sha256:ecd338e9d1947fa17ef3016edc6a4f3fa8f2c3b027c8dedbc12968cda1ff27fb
    deploy:
      resources:
        limits:
          cpus: "0.30"
          memory: 165MB

  api02:
    image: acauhi/rinha-2026-rust@sha256:ecd338e9d1947fa17ef3016edc6a4f3fa8f2c3b027c8dedbc12968cda1ff27fb
    deploy:
      resources:
        limits:
          cpus: "0.30"
          memory: 165MB
