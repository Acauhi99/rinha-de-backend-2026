name: rinha-backend-2026

services:
  lb:
    image: haproxy:2.9-alpine
    command: ["haproxy", "-f", "/usr/local/etc/haproxy/haproxy.cfg", "-db"]
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "9999:9999"
    depends_on:
      - api01
      - api02
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: 20MB

  api01:
    image: acauhi/rinha-2026-rust@sha256:ad59fe80c68824e2b7cdec5490a7a0cc2eae972d047d94564c62c8fdd4bb1acf
    deploy:
      resources:
        limits:
          cpus: "0.30"
          memory: 165MB

  api02:
    image: acauhi/rinha-2026-rust@sha256:ad59fe80c68824e2b7cdec5490a7a0cc2eae972d047d94564c62c8fdd4bb1acf
    deploy:
      resources:
        limits:
          cpus: "0.30"
          memory: 165MB
