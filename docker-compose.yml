name: rinha-backend-2026

services:
  lb:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "9999:9999"
    depends_on:
      - api01
      - api02
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 20MB

  api01:
    image: acauhi/rinha-2026-rust@sha256:1a4f267ae3af9458f1d95090c5344c7c0098d40598e91da017c4f62b01834db2
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 165MB

  api02:
