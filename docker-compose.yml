name: rinha-backend-2026

services:
  lb:
    image: haproxy:2.9-alpine
    command: ["haproxy", "-f", "/usr/local/etc/haproxy/haproxy.cfg", "-db"]
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "9999:9999"
    depends_on:
      - api01
      - api02
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: 20MB

  api01:
    image: acauhi/rinha-2026-rust@sha256:fd88a986f6ea2f5040096c746b74a0201fd8e38ef338230f4b37842d5c22cebe
    deploy:
      resources:
        limits:
          cpus: "0.300"
          memory: 165MB

  api02:
    image: acauhi/rinha-2026-rust@sha256:fd88a986f6ea2f5040096c746b74a0201fd8e38ef338230f4b37842d5c22cebe
    deploy:
      resources:
        limits:
          cpus: "0.300"
          memory: 165MB
