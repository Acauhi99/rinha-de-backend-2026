name: rinha-backend-2026

services:
  lb:
    image: haproxy:2.9-alpine
    command: ["haproxy", "-f", "/usr/local/etc/haproxy/haproxy.cfg", "-db"]
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "9999:9999"
    depends_on:
      - api01
      - api02
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: 20MB

  api01:
    image: acauhi/rinha-2026-rust@sha256:e072d9ddfe88aa5480f5c01380238e38405d49aa148fc2a69b59cf9f0f418740
    deploy:
      resources:
        limits:
          cpus: "0.300"
          memory: 165MB

  api02:
    image: acauhi/rinha-2026-rust@sha256:e072d9ddfe88aa5480f5c01380238e38405d49aa148fc2a69b59cf9f0f418740
    deploy:
      resources:
        limits:
          cpus: "0.300"
          memory: 165MB
