events {
    worker_connections 2048;
}

http {
    upstream rinha_api {
        server api01:3000 max_fails=3 fail_timeout=1s;
        server api02:3000 max_fails=3 fail_timeout=1s;
        keepalive 256;
    }

    server {
        listen 9999;

        location = /ready {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_pass http://rinha_api;
        }

        location = /fraud-score {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_pass http://rinha_api;
        }

        location / {
            return 404;
        }
    }
}
